<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site_page.title }} | {{ site_name }}</title>
    <meta name="description" content="{{ site_page.description }}">
    <link rel="canonical" href="{{ canonical }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ site_page.title }} | {{ site_name }}">
    <meta property="og:description" content="{{ site_page.description }}">
    <meta property="og:url" content="{{ canonical }}">
    {% if google_site_verification %}<meta name="google-site-verification" content="{{ google_site_verification }}">{% endif %}
    <script type="application/ld+json">{{ schema | tojson }}</script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body class="public-blog {{ site_profile_class }}" style="--primary: {{ site_theme.primary }}; --primary-dark: {{ site_theme.primary }}; --bg: {{ site_theme.background }};">
    <header class="topbar"><div class="container nav"><a class="brand" href="{{ url_for('home') }}">{{ site_name }}</a><button class="site-menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="site-navigation"><span class="visually-hidden">Open navigation menu</span><span class="site-menu-icon" aria-hidden="true"></span></button><nav id="site-navigation" class="site-navigation" aria-label="Main navigation">{% for item in site_navigation %}<a href="{{ item.url }}"{% if item.url.startswith('http') %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ item.label }}</a>{% endfor %}</nav></div></header>
    <main class="container blog-main custom-page">
      <a class="text-link" href="{{ url_for('home') }}">← Home</a>
      <article>
        <p class="eyebrow">{{ site_eyebrow }}</p>
        <h1>{{ site_page.title }}</h1>
        <div class="custom-page-content">{{ site_page.content }}</div>
      </article>
    </main>
    <footer class="public-footer"><div class="container"><a href="{{ url_for('privacy_page') }}">Privacy</a><a href="{{ url_for('editorial_policy_page') }}">Editorial policy</a><a href="{{ url_for('public_blog') }}">Journal</a></div></footer>
    <script src="{{ url_for('static', filename='public.js') }}" defer></script>
  </body>
</html>
